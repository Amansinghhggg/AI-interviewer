<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="8"/>

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#brandGrad)" opacity="0.15" filter="blur(30px)"/>

  <!-- Styled "I" + AI Spark Core Icon -->
  <g transform="translate(0,0)" filter="url(#shadow)">
    <!-- Central Beam / "I" -->
    <rect x="226" y="128" width="60" height="256" rx="30" fill="url(#brandGrad)"/>

    <!-- Left Soundwave / AI Node Pillar -->
    <rect x="146" y="192" width="44" height="128" rx="22" fill="url(#glowGrad)" opacity="0.9"/>
    <rect x="86" y="232" width="36" height="48" rx="18" fill="url(#brandGrad)" opacity="0.6"/>

    <!-- Right Soundwave / AI Node Pillar -->
    <rect x="322" y="192" width="44" height="128" rx="22" fill="url(#glowGrad)" opacity="0.9"/>
    <rect x="390" y="232" width="36" height="48" rx="18" fill="url(#brandGrad)" opacity="0.6"/>

    <!-- Top AI Sparkle -->
    <path d="M 256 96 L 264 116 L 284 124 L 264 132 L 256 152 L 248 132 L 228 124 L 248 116 Z" fill="#ffffff"/>
  </g>
</svg>
